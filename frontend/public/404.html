<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Store the requested path and search params in session storage
      sessionStorage.setItem('ghpages_redirect_path', window.location.pathname);
      sessionStorage.setItem('ghpages_redirect_search', window.location.search);
      
      // If navigating to meta-glass, redirect directly to /meta-glass/
      if (window.location.pathname.includes('meta-glass')) {
        window.location.replace(window.location.origin + '/meta-glass/');
        return;
      }
      
      // Redirect to the site root folder
      window.location.replace(window.location.origin + '/');
    </script>
  </head>
  <body>
  </body>
</html>
