<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Store the requested path and search params in session storage
      sessionStorage.setItem('ghpages_redirect_path', window.location.pathname);
      sessionStorage.setItem('ghpages_redirect_search', window.location.search);
      
      // If navigating to meta-glass, direct to the static folder
      if (window.location.pathname.includes('meta-glass')) {
        const pathParts = window.location.pathname.split('/');
        const repo = pathParts[1] ? '/' + pathParts[1] : '';
        window.location.replace(window.location.origin + repo + '/meta-glass/');
        return;
      }
      
      // Redirect to the repo root folder
      // E.g., from "/vanm/results" to "/vanm/"
      const pathParts = window.location.pathname.split('/');
      const repoPath = '/' + pathParts[1] + '/';
      window.location.replace(window.location.origin + repoPath);
    </script>
  </head>
  <body>
  </body>
</html>
